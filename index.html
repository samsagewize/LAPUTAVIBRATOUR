<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Puta Vibra Tour — CDMX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: #000;
      color: #f0ece0;
      font-family: 'Space Mono', monospace;
    }

    /* BACKGROUND */
    .bg { position: fixed; inset: 0; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); animation: drift linear infinite; }
    .orb1 { width:700px;height:700px;background:radial-gradient(circle,rgba(255,255,255,0.12),transparent 70%);top:-200px;left:-200px;animation-duration:20s; }
    .orb2 { width:500px;height:500px;background:radial-gradient(circle,rgba(200,200,200,0.1),transparent 70%);bottom:-150px;right:-150px;animation-duration:25s;animation-direction:reverse; }
    .orb3 { width:350px;height:350px;background:radial-gradient(circle,rgba(255,255,255,0.06),transparent 70%);top:50%;left:45%;animation-duration:16s; }

    @keyframes drift {
      0%   { transform:translate(0,0) scale(1); }
      33%  { transform:translate(50px,-40px) scale(1.05); }
      66%  { transform:translate(-30px,40px) scale(0.97); }
      100% { transform:translate(0,0) scale(1); }
    }

    .star { position:absolute;background:#fff;border-radius:50%;animation:twinkle ease-in-out infinite; }
    @keyframes twinkle { 0%,100%{opacity:0}50%{opacity:1} }

    /* INTRO SCREEN */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .intro-content {
      text-align: center;
      animation: introFade 2s ease forwards;
    }

    @keyframes introFade {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .drag-handle {
      margin-top: 4rem;
      padding: 1rem 2.5rem;
      border: 2px dashed rgba(240,236,224,0.5);
      border-radius: 50px;
      color: #f0ece0;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: grab;
      user-select: none;
      transition: all 0.3s;
      background: rgba(255,255,255,0.03);
    }

    .drag-handle:active { cursor: grabbing; background: rgba(255,255,255,0.1); }

    /* MAIN CONTENT (hidden behind intro) */
    .main-content {
      position: relative;
      z-index: 10;
      height: 100vh;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .main-content.visible { opacity: 1; }

    /* Your existing styles */
    .lineup-btn, .nav { position: fixed; top: 1.4rem; z-index: 60; }
    .lineup-btn { left: 2rem; }
    .nav { right: 2rem; }

    /* Rest of your styles (floater, wrap, modal, etc.) */
    .floater { position:fixed;pointer-events:none;z-index:3;will-change:transform;transition:transform 0.1s ease-out; }
    .wrap { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center; padding: clamp(5rem,12vh,9rem) 2rem clamp(3rem,6vh,5rem); height: 100vh; justify-content: center; }
  </style>
</head>
<body>

  <!-- INTRO SCREEN -->
  <div id="intro">
    <div class="intro-content">
      <img src="LPV-lpv.png" alt="La Puta Vibra" style="width: clamp(180px, 35vw, 280px); filter: drop-shadow(0 0 40px rgba(255,255,255,0.3));">
      <div style="margin-top: 3rem; font-family: 'Bebas Neue', cursive; font-size: clamp(2.2rem, 7vw, 3.8rem); letter-spacing: 0.1em; opacity: 0.9;">
        LA PUTA VIBRA
      </div>
      <div style="margin-top: 0.5rem; font-size: 0.85rem; letter-spacing: 0.4em; opacity: 0.5;">CDMX • 27 JUN 2026</div>

      <div class="drag-handle" id="dragHandle">
        ↓ DRAG DOWN TO ENTER ↓
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="mainContent">

    <div class="bg">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
      <div id="stars"></div>
    </div>
    <div class="scan"></div>

    <!-- LINEUP BUTTON -->
    <button class="lineup-btn" onclick="openLineupModal()">
      LINE UP
    </button>

    <!-- NAV -->
    <nav class="nav" id="nav">
      <button class="nav-toggle" onclick="toggleNav()">
        Menu <i class="nav-arrow">▼</i>
      </button>
      <div class="dropdown">
        <a href="https://www.instagram.com/laputavibra.tour" target="_blank">Instagram</a>
        <button onclick="openModal()">Contact</button>
      </div>
    </nav>

    <!-- LINEUP MODAL -->
    <div class="lineup-modal-overlay" id="lineupModal">
      <div class="lineup-modal">
        <button class="lineup-close" onclick="closeLineupModal()">✕</button>
        <img src="IMG_5433 (1).png" alt="Lineup">
      </div>
    </div>

    <!-- CONTACT MODAL -->
    <div class="modal-overlay" id="modal" onclick="closeOnOverlay(event)">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-label">// Bookings & Inquiries</div>
        <div class="modal-title">Contacto</div>
        <p class="modal-text">Para reservaciones, bookings y colaboraciones, escríbenos al correo:</p>
        <a href="mailto:djlamoon@gmail.com" class="modal-email"> djlamoon@gmail.com</a>
      </div>
    </div>

    <!-- FLOATERS -->
    <img class="floater f-tl" src="sticker2-lpv.png" alt="">
    <img class="floater f-br" src="sticker2-lpv.png" alt="">
    <img class="floater f-tr" src="sticker2-lpv.png" alt="">
    <img class="floater f-bl" src="sticker2-lpv.png" alt="">
    <img class="floater f-lpv" src="LPV-lpv.png" alt="LPV">

    <!-- MAIN PAGE -->
    <div class="wrap">
      <img class="main-logo" src="flyerlogonewstar.png" alt="La Puta Vibra Tour">
      <div class="date-line">27 de Junio 2026</div>
      <div class="city-line">Ciudad de México</div>
      <div class="divider"></div>
      <a href="https://www.passline.com/eventos/la-pta-vibra-tour-cdmx" target="_blank" class="ticket-btn">🎟 Compra tus boletos aquí</a>
      <div class="btn-sub">passline.com</div>
    </div>
  </div>

  <script>
    // Stars
    const c = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 1 + Math.random() * 2;
      s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*6}s;`;
      c.appendChild(s);
    }

    // Drag to enter
    let startY = 0;
    const intro = document.getElementById('intro');
    const main = document.getElementById('mainContent');
    const dragHandle = document.getElementById('dragHandle');

    function handleDrag(e) {
      const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
      const diff = clientY - startY;
      if (diff > 80) {
        intro.style.transform = `translateY(-100%)`;
        setTimeout(() => {
          intro.style.display = 'none';
          main.classList.add('visible');
        }, 600);
      }
    }

    dragHandle.addEventListener('mousedown', e => { startY = e.clientY; });
    dragHandle.addEventListener('touchstart', e => { startY = e.touches[0].clientY; });

    document.addEventListener('mousemove', e => { if (startY) handleDrag(e); });
    document.addEventListener('touchmove', e => { if (startY) handleDrag(e); });

    document.addEventListener('mouseup', () => startY = 0);
    document.addEventListener('touchend', () => startY = 0);

    // Parallax on floaters
    document.addEventListener('mousemove', e => {
      const mx = e.clientX / innerWidth - 0.5;
      const my = e.clientY / innerHeight - 0.5;
      document.querySelectorAll('.floater').forEach((el, i) => {
        const d = 10 + i * 4;
        el.style.transform = `translate(${mx*d}px,${my*d}px)`;
      });
    });

    // Your existing functions (toggleNav, modals, etc.)
    function toggleNav() { document.getElementById('nav').classList.toggle('open'); }
    function openModal() { document.getElementById('modal').classList.add('open'); }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }
    function closeOnOverlay(e) { if (e.target.id === 'modal') closeModal(); }
    function openLineupModal() { document.getElementById('lineupModal').classList.add('open'); }
    function closeLineupModal() { document.getElementById('lineupModal').classList.remove('open'); }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal();
        closeLineupModal();
      }
    });

    // Auto hide intro after some time (optional fallback)
    setTimeout(() => {
      if (intro.style.display !== 'none') {
        intro.style.transform = `translateY(-100%)`;
        setTimeout(() => {
          intro.style.display = 'none';
          main.classList.add('visible');
        }, 700);
      }
    }, 12000);
  </script>
</body>
</html>
